function vrHit(h){h.c.updateWorldMatrix(true,false);menuUI.mesh.updateWorldMatrix(true,false);const origin=h.c.getWorldPosition(new T.Vector3()),direction=new T.Vector3(0,0,-1).applyQuaternion(h.c.getWorldQuaternion(new T.Quaternion()));raycaster.set(origin,direction);return raycaster.intersectObject(menuUI.mesh)[0];}
function vrInput(h){const g=h.source.gamepad;if(!g)return;const pressed=!!g.buttons[0]?.pressed||(g.buttons[0]?.value||0)>.65;const edge=pressed&&!vrMenu.triggerDown;vrMenu.triggerDown=pressed;if(!pressed)vrMenu.triggerConsumed=false;if(!vrMenu.open){if(edge&&!vrMenu.triggerConsumed)act('Magic');return;}if(vrMenu.dirty)vrDraw();const hit=vrHit(h);const x=(hit?.uv?.x??-1)*1024,y=(1-(hit?.uv?.y??2))*768;const index=vrMenu.rows.findIndex(r=>x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h);if(index!==vrMenu.hover){vrMenu.hover=index;vrMenu.dirty=true;}vrPointer.scale.z=hit?hit.distance/2:1;const scroll=axis(g,1);if(Math.abs(scroll)<.25)vrMenu.scrollLatch=false;if(Math.abs(scroll)>.55&&!vrMenu.scrollLatch){vrMenu.scrollLatch=true;vrMenu.page=clamp(vrMenu.page+Math.sign(scroll),0,(vrMenu.pages||1)-1);vrMenu.hover=-1;vrMenu.dirty=true;return;}if(edge){vrMenu.triggerConsumed=true;const row=vrMenu.rows[index];if(row){row.fn();vrMenu.hover=-1;vrMenu.dirty=true;h.source.gamepad.hapticActuators?.[0]?.pulse(.2,35)?.catch?.(()=>{});}}}

function axis(g,i){const a=g.axes;let v=a.length>=4?a[i+2]:a[i];return Math.abs(v||0)>.16?v:0}
function validSwing(dt,distance){return Number.isFinite(dt)&&Number.isFinite(distance)&&dt>=.004&&dt<=.05&&distance>=0&&distance<=.35&&distance/dt>1.25&&distance/dt<=12;}

const xrHeading=new T.Vector3(0,0,-1);

}
function vrHands(dt,trackingDt=dt){for(const h of hands){h.cool=Math.max(0,h.cool-dt);if(!h.source||!h.grip.visible){dropHeld(h);h.grabbing=false;h.prev=null;h.arm.visible=false;continue}updateGrip(h,dt);const p=h.hand.getWorldPosition(new T.Vector3());const side=h.source.handedness==='left'?-1:1;const shoulder=head.clone().addScaledVector(right,side*.22).addScaledVector(up,-.27);const elbow=shoulder.clone().lerp(p,.5).addScaledVector(up,-.13);const d=p.clone().sub(elbow);const reach=p.distanceTo(shoulder);h.arm.visible=Number.isFinite(reach)&&reach<=.95&&d.length()<=.55;h.arm.position.copy(elbow).lerp(p,.5);if(d.lengthSq()>1e-8)h.arm.quaternion.setFromUnitVectors(up,d.clone().normalize());else h.arm.quaternion.identity();h.arm.scale.y=clamp(d.length(),.04,.55);const local=rig.worldToLocal(p.clone());if(!vrMenu.open&&h.grabbing&&h.prev&&validSwing(trackingDt,local.distanceTo(h.prev))&&h.cool===0){const start=rig.localToWorld(h.prev.clone());const seg=p.clone().sub(start);let hit=enemies.find(e=>{const center=e.g.position.clone().addScaledVector(up,.55);const t=clamp(center.clone().sub(start).dot(seg)/Math.max(.00001,seg.lengthSq()),0,1);return center.distanceTo(start.clone().addScaledVector(seg,t))<.7});if(hit){act(h.held?.kind==='sword'?'Sword':'Strike',hit);h.cool=.35;h.source.gamepad?.hapticActuators?.[0]?.pulse(.45,70)?.catch?.(()=>{})}}h.prev=local}}
renderer.xr.addEventListener('sessionstart',()=>{xrHeading.set(0,0,-1);for(const h of hands)h.prev=null});renderer.xr.addEventListener('sessionend',()=>{vrMenu.open=false;vrMenu.buttons.clear();vrMenu.triggerDown=false;vrMenu.triggerConsumed=false;vrPointer.visible=false;menuUI.mesh.visible=false;wristUI.mesh.visible=false;for(const h of hands){dropHeld(h);h.grabbing=false;h.arm.visible=false;h.prev=null;h.hand.visible=false}});$('vr').onclick=async()=>{try{if(!navigator.xr||!await navigator.xr.isSessionSupported('immersive-vr'))throw Error('VR unavailable on this browser');await renderer.xr.setSession(await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor']}))}catch(e){say(e.message)}};function frameDelta(now,last){const delta=(now-last)/1000;return Number.isFinite(delta)?Math.max(0,Math.min(.05,delta)):0;}let last=performance.now(),saveTimer=0;renderer.setAnimationLoop((now,xrFrame)=>{let trackingDt=(now-last)/1000;let dt=frameDelta(now,last);last=now;let x=mx+(keys.d?1:0)-(keys.a?1:0),z=mz+(keys.s?1:0)-(keys.w?1:0);let v;let pose=null;if(renderer.xr.isPresenting){x=0;z=0;let turn=0;for(const source of renderer.xr.getSession().inputSources){if(!source.gamepad)continue;if(source.handedness==='left'){x=axis(source.gamepad,0);z=axis(source.gamepad,1)}if(source.handedness==='right')turn=axis(source.gamepad,0)}if(vrMenu.open){x=0;z=0;turn=0;}yaw-=turn*dt*1.8;rig.rotation.y=yaw;pose=xrFrame?.getViewerPose(renderer.xr.getReferenceSpace());if(pose){updateXRBody(pose);v=right.clone().multiplyScalar(x).addScaledVector(forward,-z)}else v=new T.Vector3()}else v=new T.Vector3(x,0,z).applyAxisAngle(up,yaw);if(v.length()>1)v.normalize();player.position.addScaledVector(v,dt*4);player.position.x=clamp(player.position.x,-45,45);player.position.z=clamp(player.position.z,-45,45);if(v.length()>.1)player.rotation.y=Math.atan2(v.x,v.z);for(let e of [...enemies]){if(e.poisonTime>0){const tick=Math.min(dt,e.poisonTime);e.poisonTime-=tick;e.hp-=tick*e.poisonRate;i
